# yolov8n_SCS_step3.yaml（替换backbone第4层C2f）
nc: 2  # 2类
scales:
  n: [0.33, 0.25, 1024]  # 保持width_multiple=0.25

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0：输出64×0.25=16
  - [-1, 1, Conv, [128, 3, 2]] # 1：输出128×0.25=32
  - [-1, 3, StarBlock, [32, 32, 1]] # 2：输入32→输出32（已替换成功）
  - [-1, 1, Conv, [256, 3, 2]] # 3：输出256×0.25=64（前层32→当前64，正确）
  # 替换第4层C2f为StarBlock：输入64，输出64（256×0.25=64），重复6次
  - [-1, 6, StarBlock, [64, 64, 1]] # 4：输入64→输出64（关键替换）
  - [-1, 1, Conv, [512, 3, 2]] # 5：输出512×0.25=128（与下一层兼容）
  - [-1, 6, C2f, [512, True]] # 6：保持原始（暂不替换）
  - [-1, 1, Conv, [1024, 3, 2]] # 7：输出1024×0.25=256
  - [-1, 3, C2f, [1024, True]] # 8：保持原始
  - [-1, 1, SPPF, [1024, 5]] # 9：输出256

head:  # 保持原始，后续替换
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]] # 15
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]] # 18
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]] # 21
  - [[15, 18, 21], 1, Detect, [nc]]
