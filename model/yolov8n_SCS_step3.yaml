# yolov8n_SCS_step4.yaml
nc: 2
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, StarBlock, [32]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, StarBlock, [64]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # 256 + 128 = 384
  - [-1, 3, StarBlock, [128]]          # 384 → 128

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # 128 + 64 = 192
  - [-1, 3, StarBlock, [64]]           # 192 → 64   (P3)

  - [-1, 1, Conv, [256, 3, 2]]         # 64 → 64
  - [[-1, 12], 1, Concat, [1]]         # 64 + 128 = 192
  - [-1, 3, StarBlock, [128]]          # 192 → 128  (P4)

  - [-1, 1, Conv, [512, 3, 2]]         # 128 → 128
  - [[-1, 9], 1, Concat, [1]]          # 128 + 256 = 384
  - [-1, 3, StarBlock, [256]]          # 384 → 256  (P5)

  - [[15, 18, 21], 1, Detect, [nc]]
