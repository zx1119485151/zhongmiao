# yolov8n_SCS_step2.yaml（替换backbone第2层C2f为StarBlock）
nc: 2  # 类别数（只检测出苗）

scales:
  n: [0.33, 0.25, 1024]  # depth=0.33, width=0.25

backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0
  - [-1, 1, Conv, [128, 3, 2]]        # 1
  - [-1, 3, StarBlock, [32, 32, 1]]   # 2：替换C2f→StarBlock，输入32→输出32
  - [-1, 1, Conv, [256, 3, 2]]        # 3
  - [-1, 3, C2f, [256]]               # 4
  - [-1, 1, Conv, [512, 3, 2]]        # 5
  - [-1, 3, C2f, [512]]               # 6
  - [-1, 1, Conv, [1024, 3, 2]]       # 7
  - [-1, 3, C2f, [1024]]              # 8
  - [-1, 1, SPPF, [1024, 5]]          # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 10
  - [[-1, 6], 1, Concat, [1]]                      # 11
  - [-1, 3, C2f, [512]]                            # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 13
  - [[-1, 4], 1, Concat, [1]]                      # 14
  - [-1, 3, C2f, [256]]                            # 15
  - [-1, 1, Conv, [256, 3, 2]]                     # 16
  - [[-1, 12], 1, Concat, [1]]                     # 17
  - [-1, 3, C2f, [512]]                            # 18
  - [-1, 1, Conv, [512, 3, 2]]                     # 19
  - [[-1, 9], 1, Concat, [1]]                      # 20
  - [-1, 3, C2f, [1024]]                           # 21
  - [[15, 18, 21], 1, Detect, [nc]]                # 22
