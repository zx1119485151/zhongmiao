# 模板：训练前把完整 YOLO 数据集放到本目录，或把 path 改成你本机数据集根目录的绝对路径。
#
# 期望结构：
#   dataset/train/images  dataset/train/labels
#   dataset/valid/images  dataset/valid/labels
#   dataset/test/images
#
# 注意：YOLO 会把相对 path 拼到 ~/datasets 下，所以这里建议直接写绝对路径。
# 本目录下的 1.jpg ~ 8.jpg 只是示例图片，不构成可训练数据集。
path: /path/to/datasets_Huajiao_EX3
train: train/images
val: valid/images
test: test/images

names:
  0: Huajiao
